spring.application.name=propex
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/propex}
spring.datasource.username=${DB_USERNAME:propex}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_TTL_MS:2592000000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.server.port=${SERVER_PORT:8081}

springdoc.swagger-ui.path=/swagger-ui.html
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${APP_ENV:development}
sentry.send-default-pii=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
file.upload-dir=${FILE_UPLOAD_DIR:uploads/company-docs}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.property.management.propex=INFO
